# Production — backend connects to Amazon RDS (no local db container)
# Nginx terminates HTTPS on ports 80/443 and proxies to FastAPI on port 8000.
# Self-signed TLS certs are generated by scripts/gen-certs.sh before first run.
version: "3.9"

services:
  backend:
    build: ./backend
    container_name: hpms_backend
    env_file: .env.prod
    expose:
      - "8000"
    volumes:
      - ./frontend:/frontend:ro
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: hpms_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    restart: unless-stopped
